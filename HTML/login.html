<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login</title>
    <link rel="stylesheet" href="../CSS/login.css">
</head>

<body>
    <img class="logo" src="../Images/ourschool_logo.svg">

    <span class="login_text">
        Please Enter your Username and Password
    </span>


    <input class="inputs username" placeholder=" Username">
    <input class="inputs password" type="password" placeholder=" Password">

    <form action="/authenticate" method="post">
        <input type="image" class="login_button" src="../Images/login_button.svg">
    </form>

    <div class="signup">
        <span>
            Dont have an Account?
        </span>
        <a href="../HTML/signup.html">
            Create One
        </a>
    </div>

</body>
</html>
