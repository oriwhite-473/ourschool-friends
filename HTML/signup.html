<!DOCTYPE html>
<html lang="en">
<head>
    <title>Sign up</title>
    <link rel="stylesheet" href="../CSS/signup.css">
</head>

<body>
    <img class="logo" src="../Images/ourschool_logo.svg">

    <span class="login_text">
        Create an Account
    </span>

    <input class="inputs username" placeholder=" Username">
    <input class="inputs password" type="password" placeholder=" Password">
    <input class="inputs confirm-password" type="password" placeholder=" Confirm Password">

    <form action="/create_account" method="post">
        <input type="image" class="login_button" src="../Images/login_button.svg">
    </form>
    
    <div class="terms_and_conditions">
        <input type="checkbox">
        <span>
            I agree to the
        </span>
        <a href="../HTML/Terms.html">
            Terms and Conditions
        </a>
        <span>
            of this Website
        </span>
    </div>

</body>
</html>
